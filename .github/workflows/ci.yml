# Lint, JVM tests and all build types on every push and pull request.
# The UI suites and engine checks need an emulator and run locally (see README → Build).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests
        run: ./scripts/test.sh
      - name: Lint and builds
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug :app:assembleQa :app:assembleRelease :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
